   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(36.730617 57.272171)">Public behavioural data</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(58.888078 71.024464)">45 participants</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(68.694094 84.776757)">6,480 trials</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(222.803047 52.0847)">Source exclusions</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(219.815742 64.527251)">211 technical trials</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(217.804414 76.969802)">234 additional trials</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(214.693906 89.412352)">(response-time flags)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(378.805363 57.789073)">Retained observations</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(370.188175 70.886495)">3,005 pain + 3,030 vision</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(376.477238 83.983917)">45 people per modality</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(60.3375 163.702646)">Within-participant contrasts</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(65.742109 178.10981)">High minus low cue mean</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(29.263359 192.516975)">Matched on stimulus, cue SD and skew</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(34.209063 206.924139)">Equal weight across pairs and people</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(312.487734 163.702646)">Prediction across participants</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(294.804375 178.10981)">Train on 44 people; test on the 45th</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(316.089375 192.516975)">Repeat for every participant</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(298.201484 206.924139)">Compare three fixed linear models</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(83.422617 282.358571)">Coverage sensitivity</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(32.287617 296.110864)">43 people per modality with all 12 pairs</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(43.938516 309.863157)">42 people common to both subsets</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(325.023633 282.358571)">Participant-weighted error</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(302.407617 296.110864)">RMSE and MAE on held-out ratings</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(286.320469 309.863157)">Bootstrap intervals conditional on scores</text>
   </g>
