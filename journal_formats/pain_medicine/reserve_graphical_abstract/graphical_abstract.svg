    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(258.252109 121.790006)">High minus low cue mean</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(329.49 136.19717)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(280.051016 150.604335)">Pain: 12.08 points</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.592656 165.011499)">Vision: 9.93 points</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(329.49 179.418663)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(243.928906 193.825827)">Stable with complete coverage</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(483.421984 85.772096)">HELD-OUT PREDICTION</text>
