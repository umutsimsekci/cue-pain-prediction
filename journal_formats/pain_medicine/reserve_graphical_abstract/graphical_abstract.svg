   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5963" x="27.891" y="44.56512" transform="rotate(-0 27.891 44.56512)">Exploratory secondary analysis of public behavioural data</text>
