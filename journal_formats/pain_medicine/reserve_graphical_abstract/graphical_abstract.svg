    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(493.271281 172.215081)">Vision: 0.739 points</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(547.668 186.622245)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(459.725578 201.029409)">Interaction adds almost nothing</text>
   </g>
