    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(490.06925 114.586424)">Adding cue variables</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(500.118781 128.993588)">reduces RMSE by</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(547.668 143.400752)"/>
