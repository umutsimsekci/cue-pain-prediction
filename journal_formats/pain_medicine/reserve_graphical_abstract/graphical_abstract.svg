    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(69.836844 128.993588)">45 participants</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(55.424266 143.400752)">6,035 retained trials</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(111.312 157.807917)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(26.469344 172.215081)">Thermal pain + visual contrast</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(27.217859 186.622245)">Social cue mean, SD and skew</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(253.056328 92.975678)">WITHIN-PERSON CONTRAST</text>
